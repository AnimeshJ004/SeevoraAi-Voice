<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Seevora AI Voice Receptionist</title>
<meta name="description" content="Seevora AI Voice Receptionist. Clients, revenue, call recordings, and AI voice operations in one unified workspace." />
<meta name="theme-color" content="#0095FF" />
<link rel="icon" href="/assets/seevora-logo.png" type="image/png" />
<link rel="apple-touch-icon" href="/assets/seevora-logo.png" />
<link rel="stylesheet" href="/assets/brand.css?v=20261008-seevora" />
<link rel="stylesheet" href="/assets/app.css?v=20261008-seevora" />
</head>
<body class="grain">

<!-- Background atmosphere (shared with marketing for one cohesive product) -->
<div class="atmos" aria-hidden="true">
  <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
</div>

<!-- No-JS notice. The console is an authenticated SPA and needs JavaScript. -->
<noscript>
  <div class="nojs">
    <strong>JavaScript is required.</strong>
    The Seevora AI Voice Receptionist console is an interactive app. Please enable JavaScript to sign in and manage your agents.
  </div>
</noscript>

<!-- App root. Everything below is rendered by app.js. The skeleton here keeps the
     first paint premium even before scripts run. It is replaced on boot. -->
<div id="app" class="app-root" aria-busy="true">
  <div class="boot">
    <div class="boot-mark" aria-hidden="true">
      <img src="/assets/seevora-logo.png" alt="Seevora" width="44" height="44" style="object-fit:contain;border-radius:10px;" />
    </div>
    <div class="boot-text">Starting Seevora AI Voice Receptionist<span class="spin boot-spin"></span></div>
  </div>
</div>

<!-- Toast stack -->
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- Modal host -->
<div id="modal-host" class="modal-host hide" aria-hidden="true"></div>

<script src="/assets/app.js?v=20261007-muga-excited" defer></script>
</body>
</html>
