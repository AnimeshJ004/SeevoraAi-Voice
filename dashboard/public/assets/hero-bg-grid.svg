<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" fill="none">
  <defs>
    <!-- Ambient Radial Glow -->
    <radialGradient id="heroGlowCenter" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0d5d41" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#2f8a63" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heroGlowAccent" cx="80%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heroGlowLeft" cx="20%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Fade Out Mask -->
    <linearGradient id="verticalMaskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="heroFadeMask">
      <rect width="1440" height="680" fill="url(#verticalMaskGrad)" />
    </mask>

    <!-- Dot Grid Pattern -->
    <pattern id="microDotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#0d5d41" fill-opacity="0.14" />
    </pattern>

    <!-- Linear Perspective Lines -->
    <linearGradient id="lineGradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d5d41" stop-opacity="0" />
      <stop offset="50%" stop-color="#0d5d41" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d5d41" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g mask="url(#heroFadeMask)">
    <!-- 1. Ambient Glow Layers -->
    <rect width="1440" height="680" fill="url(#heroGlowCenter)" />
    <rect width="1440" height="680" fill="url(#heroGlowAccent)" />
    <rect width="1440" height="680" fill="url(#heroGlowLeft)" />

    <!-- 2. Dot Matrix Grid -->
    <rect width="1440" height="680" fill="url(#microDotGrid)" />

    <!-- 3. Acoustic Soundwave Contour Arcs -->
    <path d="M-100,240 C280,180 520,320 720,240 C920,160 1160,280 1540,220" stroke="url(#lineGradH)" stroke-width="1.5" fill="none" />
    <path d="M-100,280 C260,220 500,360 720,280 C940,200 1180,320 1540,260" stroke="url(#lineGradH)" stroke-width="1.2" stroke-dasharray="4 4" fill="none" />
    <path d="M-100,320 C240,260 480,400 720,320 C960,240 1200,360 1540,300" stroke="url(#lineGradH)" stroke-width="1.5" fill="none" />
    <path d="M-100,360 C220,300 460,440 720,360 C980,280 1220,400 1540,340" stroke="url(#lineGradH)" stroke-width="1" stroke-dasharray="6 6" fill="none" />

    <!-- 4. Subtle Concentric Telephony Radar Rings -->
    <circle cx="720" cy="180" r="160" stroke="#0d5d41" stroke-opacity="0.06" stroke-width="1" fill="none" />
    <circle cx="720" cy="180" r="280" stroke="#0d5d41" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="8 8" fill="none" />
    <circle cx="720" cy="180" r="420" stroke="#0d5d41" stroke-opacity="0.03" stroke-width="1" fill="none" />
    <circle cx="720" cy="180" r="580" stroke="#0d5d41" stroke-opacity="0.02" stroke-width="1" fill="none" />

    <!-- 5. Floating Glowing Crosses / Plus Marks at Grid Junctions -->
    <g fill="#10b981" fill-opacity="0.35">
      <path d="M240,140 h8 v2 h-8 v8 h-2 v-8 h-8 v-2 h-8 v-2 h8 v-8 h2 v8 z" transform="scale(0.5) translate(240, 140)" />
      <path d="M1200,160 h8 v2 h-8 v8 h-2 v-8 h-8 v-2 h-8 v-2 h8 v-8 h2 v8 z" transform="scale(0.5) translate(1200, 160)" />
      <path d="M380,320 h8 v2 h-8 v8 h-2 v-8 h-8 v-2 h-8 v-2 h8 v-8 h2 v8 z" transform="scale(0.5) translate(380, 320)" />
      <path d="M1060,340 h8 v2 h-8 v8 h-2 v-8 h-8 v-2 h-8 v-2 h8 v-8 h2 v8 z" transform="scale(0.5) translate(1060, 340)" />
    </g>
  </g>
</svg>
